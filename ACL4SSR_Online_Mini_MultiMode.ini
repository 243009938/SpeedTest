[custom]
; =================================================================
;              CF 免费节点专属优化模板（稳定修复版）
; =================================================================

; ----------------- 基础开关与规则集模式 -----------------
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_provider=true

; ----------------- 规则集定义 (Rule Sets) -----------------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=☁️ CloudFlare,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CloudflareCIDR.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ----------------- 策略组配置 (Proxy Groups) -----------------
; 主选择组：默认使用更稳定的【自动优选】，故障转移作为备选
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动优选`[]🔯 稳定故障转移`[]DIRECT`.*

; 自动优选：放宽容差至 120ms，有效抑制跳 IP 验证码，探测超时设为 5000ms
custom_proxy_group=♻️ 自动优选`url-test`^(?!(.*(原生|剩余|到期|官网|流量|Update|Expire|Traffic))).*$`http://www.gstatic.com/generate_204`180,5000,120

; 稳定故障转移：将超时放宽到 5000ms，杜绝假死断网
custom_proxy_group=🔯 稳定故障转移`fallback`^(?!(.*(原生|剩余|到期|官网|流量|Update|Expire|Traffic))).*$`http://www.gstatic.com/generate_204`180,5000

; 直连 / 拦截策略组
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

; Cloudflare 流量分流
custom_proxy_group=☁️ CloudFlare`select`[]🚀 节点选择`[]DIRECT`[]♻️ 自动优选`.*

; 漏网之鱼兜底
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动优选`.*
